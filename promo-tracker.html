<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D4ED8'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3Ee%3C/text%3E%3C/svg%3E">
  <title>eGenie · Promo Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* ============================ DESIGN TOKENS (sampled from eGenie screenshots) === */
:root{
  --nav:#0E1320; --nav-2:#191E2B; --nav-3:#262B38; --nav-label:#7A8699; --nav-text:#E2E6EE;
  --blue:#387FEF; --blue-deep:#2F6ED0; --blue-soft:#EFF5FE; --blue-line:#CFE0FB;
  --ink:#0F1729; --ink-2:#334158; --muted:#64748B; --muted-2:#8A97AB;
  --line:#E6EAF2; --line-2:#EFF2F7; --chip:#EFF1F5;
  --red:#DC2626; --red-2:#B91C1C; --red-soft:#FEF2F2; --red-line:#FBD5D5;
  --amber:#D97706; --amber-ink:#92400E; --amber-soft:#FFFBEB; --amber-line:#FDE3A7;
  --green:#15803D; --green-soft:#F0FDF4; --green-line:#BBF7D0;
  --violet:#7C3AED; --violet-soft:#F5F3FF; --violet-line:#DDD6FE;
  --slate-soft:#F6F8FB;
  --r-card:14px; --r-ctrl:12px; --r-pill:999px;
  --sh:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --sh-lg:0 8px 28px rgba(16,24,40,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Lato',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); background:#fff; -webkit-font-smoothing:antialiased;
  font-size:14px; line-height:1.45;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ============================ APP SHELL ======================================= */
.app{display:flex;min-height:100vh;background:var(--nav)}
.main{background:#fff}
.sidebar{width:230px;flex:0 0 230px;background:var(--nav);color:#fff;padding:16px 14px 28px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar::-webkit-scrollbar-thumb{background:#2A3040}
.brand{display:flex;align-items:center;gap:10px;padding:4px 4px 2px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,#5EA0FF,#2F6ED0);display:grid;place-items:center;font-size:20px;font-weight:900;color:#fff;font-style:italic}
.brand .bt{font-size:17px;font-weight:700;letter-spacing:-.2px;line-height:1.1}
.brand .bs{font-size:11.5px;color:#94A3B8}
.brand .burger{margin-left:auto;display:flex;flex-direction:column;gap:3px;padding:6px}
.brand .burger i{display:block;width:15px;height:2px;background:#CBD5E1;border-radius:2px}
.nav-label{font-size:9.5px;font-weight:700;letter-spacing:1.3px;color:var(--nav-label);margin:20px 6px 8px}
.client-card{background:var(--nav-2);border-radius:10px;padding:11px 13px;display:flex;align-items:center;font-weight:700;font-size:14px}
.client-card svg{margin-left:auto;opacity:.5}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--nav-text);font-size:13.5px;font-weight:700;position:relative;margin-bottom:2px;width:100%;text-align:left}
.nav-item:hover{background:#161C2A}
.nav-item.on{background:var(--nav-3);color:#fff}
.nav-item.on::before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--blue)}
.nav-item svg{flex:0 0 16px;opacity:.9}
.nav-item .badge{margin-left:auto;background:#E23B3B;color:#fff;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px}
.nav-item .newtag{margin-left:auto;background:rgba(56,127,239,.18);color:#8DBBFF;font-size:9px;font-weight:900;letter-spacing:.6px;padding:2px 6px;border-radius:5px}
.allplat{width:100%;background:#fff;color:var(--ink);border-radius:10px;padding:10px;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:9px}
.plat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.plat{background:var(--nav-2);border-radius:9px;padding:6px 7px;display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:#EAEEF6;overflow:hidden}
.plat i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:900;font-style:normal;flex:0 0 22px}
.plat span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
.topbar{background:#fff;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px;padding:11px 22px;position:sticky;top:0;z-index:40}
.page-title{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-right:auto}
.ctrl{border:1px solid var(--line);border-radius:var(--r-ctrl);padding:6px 12px;display:flex;align-items:center;gap:9px;background:#fff}
.ctrl .lab{font-size:9.5px;font-weight:700;letter-spacing:.9px;color:var(--muted);text-transform:uppercase}
.ctrl .val{font-weight:700;font-size:13.5px}
.pill-blue{background:var(--blue-soft);color:var(--blue-deep);font-weight:700;font-size:12px;padding:2px 9px;border-radius:7px;display:inline-flex;align-items:center;gap:4px}
.iconbtn{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--ink-2)}
.iconbtn.plain{border:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700}
.bell{position:relative}
.bell .dot{position:absolute;top:-4px;right:-5px;background:#E23B3B;color:#fff;font-size:9px;font-weight:900;border-radius:999px;padding:1px 4px}

.subbar{display:flex;align-items:center;gap:8px;padding:11px 22px;border-bottom:1px solid var(--line-2);background:#fff;position:sticky;top:57px;z-index:35;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:7px;border:1px solid transparent}
.tab:hover{background:var(--slate-soft)}
.tab.on{background:var(--blue);color:#fff}
.tab .n{background:rgba(255,255,255,.22);border-radius:6px;padding:0 6px;font-size:11px}
.tab:not(.on) .n{background:var(--chip);color:var(--muted)}
.subbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.mini{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px;background:#fff}

.canvas{flex:1;padding:22px 22px 70px;background:
  linear-gradient(180deg,#E6EAF9 0%,#F2F5FC 220px,#FFFFFF 460px);}
.wrap{max-width:1560px;margin:0 auto}

/* ============================ PRIMITIVES ====================================== */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sh)}
.pad{padding:18px}
.sec-h{display:flex;align-items:center;gap:8px;margin:26px 0 12px;font-size:16.5px;font-weight:700;letter-spacing:-.2px}
.sec-h .hint{width:15px;height:15px;border-radius:50%;border:1.4px solid #B6C0D0;color:#8A97AB;font-size:10px;display:grid;place-items:center;font-weight:700;cursor:help}
.sec-h .rt{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted-2)}
.hr{flex:1;height:1px;background:var(--line);margin-left:6px}
.sev{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:900;letter-spacing:.9px}
.sev b{width:7px;height:7px;border-radius:50%;display:block}
.sev.crit{background:var(--red-soft);border:1px solid var(--red-line);color:var(--red)}
.sev.crit b{background:var(--red)}
.sev.warn{background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber-ink)}
.sev.warn b{background:#F59E0B}
.sev.info{background:var(--blue-soft);border:1px solid var(--blue-line);color:var(--blue-deep)}
.sev.info b{background:var(--blue)}
.meta{font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--muted-2);text-transform:uppercase}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:10px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;border:1px solid transparent;white-space:nowrap}
.t-red{background:var(--red-soft);border-color:var(--red-line);color:var(--red)}
.t-amb{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber-ink)}
.t-grn{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
.t-blu{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue-deep)}
.t-vio{background:var(--violet-soft);border-color:var(--violet-line);color:var(--violet)}
.t-gry{background:var(--slate-soft);border-color:var(--line);color:var(--muted)}
.delta{background:var(--chip);border-radius:8px;padding:3px 10px;font-weight:900;font-size:12.5px;display:inline-block}
.delta.neg{color:var(--red)} .delta.pos{color:var(--green)} .delta.amb{color:var(--amber)}
.btn{border-radius:10px;padding:8px 15px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink-2)}
.btn:hover{background:var(--slate-soft)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-deep)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dgr{background:#fff;border-color:var(--red-line);color:var(--red)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* attention rail */
.rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{height:6px}
.acard{flex:0 0 316px;scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:16px;box-shadow:var(--sh);position:relative;cursor:pointer;transition:.15s}
.acard:hover{box-shadow:var(--sh-lg);transform:translateY(-1px)}
.acard .top{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.acard .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 32px}
.acard h4{margin:0 0 5px;font-size:14.5px;font-weight:700;line-height:1.32;letter-spacing:-.1px}
.acard p{margin:0 0 11px;font-size:12.5px;color:var(--muted);line-height:1.4}
.acard .chev{position:absolute;right:14px;top:14px;color:#B6C0D0}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:15px 16px 13px;box-shadow:var(--sh);cursor:pointer;transition:.15s}
.kpi:hover{box-shadow:var(--sh-lg)}
.kpi .kt{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:900;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.kpi .kt .st{margin-left:auto;font-size:10px;padding:2px 9px;border-radius:999px;font-weight:900;letter-spacing:.3px}
.kpi .kv{font-size:29px;font-weight:900;letter-spacing:-1px;margin:7px 0 2px;display:flex;align-items:baseline;gap:9px}
.kpi .kv small{font-size:12.5px;font-weight:900}
.kpi .kf{font-size:11.5px;font-weight:700;color:var(--muted)}
.spark{height:34px;width:100%;margin:2px 0}

/* deep dive chips */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.chipc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;display:flex;gap:11px;align-items:flex-start;cursor:pointer}
.chipc:hover{border-color:var(--blue-line);background:var(--blue-soft)}
.chipc .ic{width:30px;height:30px;border-radius:8px;background:var(--slate-soft);display:grid;place-items:center;flex:0 0 30px;color:var(--blue-deep)}
.chipc .lb{font-size:9.5px;font-weight:900;letter-spacing:.9px;color:var(--muted);text-transform:uppercase}
.chipc .vl{font-size:19px;font-weight:900;letter-spacing:-.5px;line-height:1.15}
.chipc .sb{font-size:11px;color:var(--muted);font-weight:700}

/* tables */
table{width:100%;border-collapse:collapse}
thead th{font-size:9.5px;font-weight:900;letter-spacing:1px;color:var(--muted);text-transform:uppercase;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);background:#FBFCFE;white-space:nowrap;position:sticky;top:0;z-index:2}
tbody td{padding:12px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle}
tbody tr:hover{background:#FAFCFF}
tbody tr.clickable{cursor:pointer}
.tnum{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.skucell{font-weight:700;line-height:1.3}
.skucell small{display:block;font-weight:700;color:var(--muted-2);font-size:11px}
.pl{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;white-space:nowrap}
.pl i{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:900;font-style:normal;flex:0 0 19px}

/* matrix */
.matrix{overflow:auto;max-height:760px}
.matrix table{border-collapse:separate;border-spacing:0}
.matrix th.sk{position:sticky;left:0;z-index:3;background:#FBFCFE;min-width:250px}
.matrix td.sk{position:sticky;left:0;z-index:1;background:#fff;border-right:1px solid var(--line);min-width:250px}
.matrix tr:hover td.sk{background:#FAFCFF}
.cell{width:64px;height:38px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:12px;font-variant-numeric:tabular-nums;margin:0 auto;cursor:pointer;border:1px solid transparent}
.cell:hover{outline:2px solid var(--blue);outline-offset:1px}
.c-match{background:#EAF7EF;color:#15803D;border-color:#CBEBD8}
.c-under{background:#FDECEC;color:#B91C1C;border-color:#F8CFCF}
.c-under.deep{background:#DC2626;color:#fff;border-color:#DC2626}
.c-over{background:#FFF4E5;color:#B45309;border-color:#FBE0B8}
.c-nv{background:#F5F3FF;color:#6D28D9;border-color:#E3DDFC}
.c-nl{background:#F1F5F9;color:#94A3B8;border-color:#E2E8F0}
.c-none{background:#FBFCFE;color:#CBD5E1;border-color:#F1F5F9}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:4px;display:block}

/* drawer / modal */
.scrim{position:fixed;inset:0;background:rgba(15,23,41,.42);backdrop-filter:blur(2px);z-index:80;opacity:0;pointer-events:none;transition:.18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(940px,94vw);background:#fff;z-index:90;transform:translateX(100%);transition:.24s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-14px 0 44px rgba(15,23,41,.16)}
.drawer.on{transform:none}
.drawer .dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px}
.drawer .db{overflow-y:auto;padding:20px 22px 40px;flex:1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);width:min(720px,94vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;z-index:95;opacity:0;pointer-events:none;transition:.18s;box-shadow:var(--sh-lg)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.x{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--slate-soft)}

/* misc */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.split{display:grid;grid-template-columns:1fr 400px;gap:14px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border:0}
.kv .k{color:var(--muted);font-weight:700}
.kv .v{font-weight:700;text-align:right}
.bar{height:7px;border-radius:99px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.note{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:12px;padding:12px 14px;font-size:12.5px;color:#1E3A6E;line-height:1.5}
.note b{color:#12294F}
.note.amb{background:var(--amber-soft);border-color:var(--amber-line);color:#78350F}
.note.red{background:var(--red-soft);border-color:var(--red-line);color:#7F1D1D}
.note.grn{background:var(--green-soft);border-color:var(--green-line);color:#14532D}
.raw{font-family:'JetBrains Mono',monospace;font-size:12px;background:#F8FAFC;border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:#334158;white-space:pre-wrap;line-height:1.5}
.steps{display:flex;align-items:center;gap:0;margin-bottom:16px}
.step{display:flex;align-items:center;gap:9px;padding:8px 16px 8px 14px;font-size:12.5px;font-weight:700;color:var(--muted)}
.step .b{width:22px;height:22px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--muted)}
.step.done{color:var(--green)} .step.done .b{background:var(--green-soft);color:var(--green);border:1px solid var(--green-line)}
.step.now{color:var(--blue-deep)} .step.now .b{background:var(--blue);color:#fff}
.step-sep{width:26px;height:1.5px;background:var(--line);border-radius:2px}
.fab{position:fixed;right:24px;bottom:22px;background:linear-gradient(135deg,#4A8EF3,#2F6ED0);color:#fff;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px;box-shadow:0 10px 26px rgba(47,110,208,.36);z-index:50}
.footer{display:flex;align-items:center;gap:14px;padding:12px 22px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted-2);font-weight:700}
.footer .live{color:var(--green)}
.empty{display:grid;place-items:center;padding:70px 20px;text-align:center}
.empty .ic{width:64px;height:64px;border-radius:18px;background:var(--amber-soft);border:1px solid var(--amber-line);display:grid;place-items:center;margin-bottom:16px}
.hero{padding:6px 2px 18px}
.hero h1{margin:0 0 5px;font-size:27px;font-weight:900;letter-spacing:-.9px}
.hero .eyebrow{font-size:10px;font-weight:900;letter-spacing:1.6px;color:var(--muted-2);text-transform:uppercase;margin-bottom:7px}
.hero p{margin:0;color:var(--muted);font-size:13.5px;font-weight:700}
.ribbon{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:11px 16px;box-shadow:var(--sh);margin-bottom:18px}
.ribbon .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.seg{display:inline-flex;background:var(--slate-soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
input[type=text],input[type=number],input[type=date],select,textarea{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:8px 11px;width:100%;color:var(--ink);background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-line);border-color:var(--blue)}
label.fl{font-size:10px;font-weight:900;letter-spacing:.9px;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:5px}
.radio{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;transition:.12s}
.radio:hover{border-color:var(--blue-line);background:#FBFDFF}
.radio.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 3px rgba(56,127,239,.09)}
.radio .rb{width:17px;height:17px;border-radius:50%;border:2px solid #C3CEDF;flex:0 0 17px;margin-top:2px;display:grid;place-items:center}
.radio.on .rb{border-color:var(--blue)}
.radio.on .rb::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--blue)}
.tl{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.tl div{display:grid;place-items:center;font-size:10.5px;font-weight:900;color:#fff;letter-spacing:.2px}

const fmt = (n,d=1)=> n===null||n===undefined ? '—' : (n>0?'+':'')+n.toFixed(d);
const pct = (n,d=1)=> n===null||n===undefined ? '—' : n.toFixed(d)+'%';
function sparkline(vals, color, fill){
  const w=250,h=34,mx=Math.max(...vals),mn=Math.min(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-2-((v-mn)/rg)*(h-6)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${fill?`<path d="${d} L${w} ${h} L0 ${h} Z" fill="${color}" opacity=".08"/>`:''}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function cellFor(v){
  if(v===null) return `<div class="cell c-none" title="No commitment">·</div>`;
  if(v==='NV') return `<div class="cell c-nv" title="Committed but not price-verifiable">NV</div>`;
  if(v==='NL') return `<div class="cell c-nl" title="Committed but SKU never listed on this platform">NL</div>`;
  const cls = v<=-8?'c-under deep': v<=-1?'c-under': v>=1?'c-over':'c-match';
  return `<div class="cell ${cls}" title="Deviation ${fmt(v)}pt">${fmt(v)}</div>`;
}

function dayChart(d){
  const W=880,H=210,PADL=42,PADB=26,PADT=14;
  const n=d.series.length, all=[...d.series,...d.cSeries];
  const mx=Math.max(6,Math.ceil(Math.max(...all)/5)*5), bw=(W-PADL-8)/n;
  const y = v => PADT + (1-v/mx)*(H-PADT-PADB);
  const bars = d.series.map((v,i)=>{
    const c=d.cSeries[i]??0, dev=v-c;
    const col = dev<-1?'#DC2626': dev>1?'#F59E0B':'#22A366';
    const yy=y(v), hh=Math.max(1,(H-PADB)-yy);
    return `<rect x="${PADL+i*bw+1.5}" y="${yy}" width="${bw-3}" height="${hh}" rx="2.5" fill="${col}" opacity=".88">
      <title>Day ${i+1}: actual ${v.toFixed(1)}% vs committed ${c.toFixed(1)}%</title></rect>`;}).join('');
  const cline = d.cSeries.map((v,i)=>`${i?'L':'M'}${(PADL+i*bw+bw/2).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const grid = [0,.25,.5,.75,1].map(t=>{const yy=PADT+t*(H-PADT-PADB), val=(mx*(1-t)).toFixed(0);
    return `<line x1="${PADL}" x2="${W}" y1="${yy}" y2="${yy}" stroke="#EFF2F7"/>
            <text x="${PADL-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="#8A97AB" font-weight="700">${val}%</text>`;}).join('');
  const days = d.series.map((_,i)=> (i%3===0)?`<text x="${PADL+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#8A97AB" font-weight="700">${i+1}</text>`:'').join('');
  const ev = d.eventNote?`<rect x="${PADL+11*bw}" y="${PADT}" width="${5*bw}" height="${H-PADT-PADB}" fill="#387FEF" opacity=".07"/>
     <text x="${PADL+11*bw+4}" y="${PADT+13}" font-size="9.5" fill="#2F6ED0" font-weight="900">EVENT WINDOW</text>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${ev}${bars}
    <path d="${cline}" fill="none" stroke="#0F1729" stroke-width="2" stroke-dasharray="5 4"/>${days}</svg>
    <div style="display:flex;gap:18px;margin-top:10px;font-size:11.5px;font-weight:700;color:var(--muted);flex-wrap:wrap">
      <span style="display:flex;align-items:center;gap:6px"><i style="width:16px;height:0;border-top:2px dashed #0F1729;display:block"></i>Committed depth</span>
      <span style="display:flex;align-items:center;gap:6px"><i style="width:11px;height:11px;border-radius:3px;background:#22A366;display:block"></i>Actual — in band</span>
      <span style="display:flex;align-items:center;gap:6px"><i style="width:11px;height:11px;border-radius:3px;background:#DC2626;display:block"></i>Actual — under</span>
      <span style="display:flex;align-items:center;gap:6px"><i style="width:11px;height:11px;border-radius:3px;background:#F59E0B;display:block"></i>Actual — over</span></div>`;
}

      </div>
      <div style="flex:1;min-width:320px">
        <div class="meta" style="margin-bottom:6px">WHAT eGENIE UNDERSTOOD</div>
        ${r.seg.length?`<div class="tl" style="margin-bottom:9px">
          ${r.seg.map(s=>`<div style="flex:1;background:${segColors[s.t]||'#387FEF'}" title="${s.d}: ${s.v}">${s.v}</div>`).join('')}</div>
          ${r.seg.map(s=>`<div class="kv" style="padding:5px 0"><span class="k">${s.d}</span><span class="v">${s.v}</span></div>`).join('')}`

  ${CONFLICTS.map(c=>{
    const picked = S.conflictPick[c.id];
    return `<div class="card" style="margin-bottom:12px;border-left:4px solid ${picked!==undefined?'#22A366':c.sev==='crit'?'#DC2626':c.sev==='warn'?'#F59E0B':'#387FEF'}">

        </div>
        <div class="grid2" style="margin-bottom:12px">
          ${[['A',c.a],['B',c.b]].map(([tag,x])=>`<div style="border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:#FBFCFE">
            <div style="display:flex;gap:7px;align-items:center;margin-bottom:6px">
              <span style="width:20px;height:20px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900">${tag}</span>
              <b style="font-size:12.5px">${x.src}</b></div>

            <div class="kv" style="padding:5px 0"><span class="k">Entered by</span><span class="v" style="font-size:12px">${x.by}</span></div>

        <div style="display:grid;gap:8px">
          ${c.opts.map((o,i)=>`<div class="radio ${picked===i?'on':''}" onclick="S.conflictPick['${c.id}']=${i};render()">
            <span class="rb"></span><div><b style="font-size:13px">${o}</b></div></div>`).join('')}
        </div>
      </div>
    </div>`;}).join('')}

  <div class="sec-h">Conflict types the system detects</div>
  <div class="card pad">
    <table><thead><tr><th>Type</th><th>Trigger</th><th>Default handling</th><th>Blocks lock?</th></tr></thead><tbody>
    ${[['Exact duplicate','Same SKU × platform × dates × value, twice','Auto-dedupe, logged','No'],
       ['Overlapping different values','Same SKU × platform, overlapping dates, different depth','Ask — with a “split the timeline” option','Yes'],
       ['Manual vs bulk','A manual entry and an uploaded row cover the same SKU','Ask — precedence rule shown as the default','Yes'],
       ['Partial date overlap','Manual 1–10, upload 5–20','Ask — offer boundary split at day 5 and day 11','Yes'],
       ['Scope mismatch','Text says “Amazon Only”, grid marks 6 platforms Yes','Ask — text vs grid','Yes'],
       ['Platform-cell override','Platform column holds promo text, not Yes/No','Treat as platform-specific override, flag amber','No'],
       ['MRP conflict','MRP in the text ≠ catalog MRP','Default to catalog, ask to confirm','No'],
       ['Cross-period spill','Commitment starts before or ends after the period','Clip to period, offer amendment on the locked neighbour','Yes'],
       ['Re-upload of a reviewed file','Same file uploaded again after review','Diff view — only changed rows re-enter review','No'],
       ['Same SKU, two brands/BUs','Row-level brand disagrees with catalog','Catalog wins, mismatch logged for the catalog team','No'],
       ['Multi-SKU cell','One cell names two or more packs','Explode into separate lines, confirm each','No'],
       ['Committed on unlisted SKU','No listing history on that platform','Allowed, but pre-flagged so it is not read as a pricing failure','No'],
      ].map(r=>`<tr><td style="font-weight:700">${r[0]}</td><td style="color:var(--muted);font-weight:700">${r[1]}</td>

    </tbody></table>
  </div>`;
}

      <button class="btn sm">${I.down} Import from platform KAM sheet</button>
      <button class="btn sm pri">${I.plus} Add event</button></div>
  </div>

  <div class="card pad" style="margin-bottom:16px">
    <div style="display:grid;grid-template-columns:repeat(31,1fr);gap:2px;margin-bottom:8px">
      ${Array.from({length:31},(_,i)=>`<div style="text-align:center;font-size:9.5px;font-weight:900;color:${i%7===0||i%7===1?'#DC2626':'#8A97AB'}">${i+1}</div>`).join('')}</div>
    ${EVENTS.map(track).join('')}
    <div style="height:8px"></div>
    <div class="legend"><span>Shaded columns are weekends (Sat + Sun, per client setting)</span>
      <span style="margin-left:auto"><button class="btn sm">Change weekend definition</button></span></div>
  </div>

  <div class="split">
    <div class="card" style="overflow:hidden">
      <div class="pad" style="border-bottom:1px solid var(--line)"><b>Events</b></div>
      <table><thead><tr><th>Event</th><th>Platforms</th><th>Dates</th>
        <th style="text-align:right">Commitments using it</th><th>Status</th><th style="width:24px"></th></tr></thead>
      <tbody>${EVENTS.map(e=>`<tr class="clickable"><td style="font-weight:700">${e.n}</td>
        <td><div style="display:flex;gap:4px">${e.p.map(k=>`<i style="width:19px;height:19px;border-radius:5px;background:${PLAT[k].bg};color:${PLAT[k].fg};display:grid;place-items:center;font-size:10.5px;font-weight:900;font-style:normal" title="${PLAT[k].n}">${PLAT[k].s}</i>`).join('')}</div></td>
        <td class="mono" style="font-size:12px">${String(e.s).padStart(2,'0')}–${String(e.e).padStart(2,'0')} Aug</td>
        <td class="tnum">${e.used}</td><td><span class="tag t-grn">CONFIRMED</span></td>
        <td style="color:#B6C0D0">${I.chev}</td></tr>`).join('')}
        <tr class="clickable" style="background:#FFFBEB"><td style="font-weight:700">Flipkart Big Billion pre-sale</td>
        <td><i style="width:19px;height:19px;border-radius:5px;background:${PLAT.FLK.bg};color:${PLAT.FLK.fg};display:grid;place-items:center;font-size:10.5px;font-weight:900;font-style:normal">F</i></td>
        <td class="mono" style="font-size:12px">18–22 Sep?</td><td class="tnum">17</td>
        <td><span class="tag t-amb">PROVISIONAL</span></td><td style="color:#B6C0D0">${I.chev}</td></tr>
      </tbody></table>
    </div>
    <div>
      <div class="card pad" style="margin-bottom:14px">
        <b style="font-size:14.5px">How an event-day promo resolves</b>
        <div style="height:10px"></div>
        <div class="raw" style="margin-bottom:10px">“10% &amp; 15% on event days”</div>
        <div class="kv"><span class="k">Base depth (BAU)</span><span class="v">10%</span></div>
        <div class="kv"><span class="k">Event depth</span><span class="v">15%</span></div>
        <div class="kv"><span class="k">Event days resolved</span><span class="v">05–09 Aug, 28–30 Aug</span></div>
        <div class="kv"><span class="k">Days at 15%</span><span class="v">8</span></div>
        <div class="kv"><span class="k">Days at 10%</span><span class="v">23</span></div>
        <div style="height:10px"></div>
        <div class="note"><b>Convention:</b> where two values are given with no other qualifier, the <b>lower is BAU and
          the higher is the event depth</b>. The parser states this assumption on the row, which is exactly why those
          rows land in amber rather than green — the reading is almost always right, and it is never assumed silently.</div>
      </div>
      <div class="note amb"><b>If an event isn't confirmed before lock</b>, commitments referencing it fall back to
        their BAU depth and the affected lines are marked on the dashboard, so an unconfirmed calendar can never
        quietly manufacture a compliance failure.</div>
    </div>
  </div>`;
}

/* ============================================================================
   BOOT
============================================================================ */
function render(){
  const v = {overview:vOverview,matrix:vMatrix,deviations:vDeviations,locations:vLocations,
             configurator:vConfigurator,calendar:vCalendar}[S.tab];
  document.getElementById('view').innerHTML = v();
}
renderSidebar(); renderTopbar(); renderSubbar(); render();
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAll(); });
</script>
