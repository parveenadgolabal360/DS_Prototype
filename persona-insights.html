<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue:#2563EB; --blue-light:#EFF6FF; --blue-mid:#93C5FD;
  --navy:#1E293B; --slate:#64748B; --slate-light:#94A3B8;
  --border:#E2E8F0; --bg:#F8FAFC; --white:#fff;
  --green:#16A34A; --green-bg:#DCFCE7;
  --amber:#D97706; --amber-bg:#FEF3C7;
  --red:#DC2626; --red-bg:#FEE2E2;
  --violet:#7C3AED; --pink:#DB2777; --orange:#EA580C; --cyan:#0891B2;
  --indigo-bg:#EEF2FF; --indigo:#4F46E5;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.10);
}
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--navy); font-size:14px; line-height:1.5; min-height:100vh; }
.font-mono { font-family:'DM Mono',monospace; }

/* ── TOPBAR ── */
.topbar { background:var(--white); border-bottom:1px solid var(--border); height:52px; display:flex; align-items:center; padding:0 24px; gap:14px; position:sticky; top:0; z-index:200; }
.topbar-title { font-size:15px; font-weight:600; }
.tb-pill { display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:13px; color:var(--slate); cursor:pointer; white-space:nowrap; }
.brand-badge { display:flex; align-items:center; gap:8px; background:var(--blue); color:#fff; border-radius:8px; padding:6px 12px; font-size:13px; font-weight:500; white-space:nowrap; }
.toggle-sw { width:36px; height:20px; background:#CBD5E1; border-radius:10px; position:relative; cursor:pointer; flex-shrink:0; }
.toggle-sw::after { content:''; position:absolute; width:16px; height:16px; background:#fff; border-radius:50%; top:2px; left:2px; box-shadow:0 1px 3px rgba(0,0,0,.2); }

/* ── PERSONA SWITCHER ── */
.persona-switch { position:relative; }
.persona-btn { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border); border-radius:8px; padding:5px 12px 5px 8px; cursor:pointer; font-family:inherit; }
.persona-btn:hover { border-color:var(--blue); }
.persona-av { width:28px; height:28px; border-radius:7px; background:var(--indigo-bg); color:var(--indigo); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
.persona-meta { text-align:left; line-height:1.2; }
.persona-role { font-size:10px; color:var(--slate-light); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
.persona-name { font-size:13px; font-weight:600; }
.persona-menu { display:none; position:absolute; top:44px; right:0; width:300px; background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-md); z-index:250; overflow:hidden; padding:6px; }
.persona-menu.open { display:block; }
.pm-group { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--slate-light); padding:8px 10px 4px; }
.pm-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer; }
.pm-item:hover { background:var(--bg); }
.pm-item.active { background:var(--blue-light); }
.pm-item .persona-av { width:30px; height:30px; }
.pm-item-txt { flex:1; }
.pm-item-name { font-size:13px; font-weight:600; }
.pm-item-sub { font-size:11px; color:var(--slate); }
.pm-tag { font-size:9px; font-weight:700; padding:2px 7px; border-radius:99px; text-transform:uppercase; letter-spacing:.04em; }
.pm-tag.built { background:var(--green-bg); color:var(--green); }
.pm-tag.avail { background:#F1F5F9; color:var(--slate); }

/* ── LAYOUT ── */
.layout { display:flex; min-height:calc(100vh - 52px); }
.sidebar { width:56px; background:var(--navy); display:flex; flex-direction:column; align-items:center; padding:16px 0; gap:4px; flex-shrink:0; position:sticky; top:52px; height:calc(100vh - 52px); }
.si { width:40px; height:40px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#94A3B8; transition:all .15s; position:relative; }
.si:hover { background:rgba(255,255,255,.08); color:#fff; }
.si.active { background:var(--blue); color:#fff; }
.si svg { width:18px; height:18px; }
.si-tip { position:absolute; left:52px; background:var(--navy); color:#fff; font-size:11px; padding:4px 9px; border-radius:6px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s; z-index:210; }
.si:hover .si-tip { opacity:1; }
.main { flex:1; padding:24px; overflow-y:auto; }
.page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:16px; flex-wrap:wrap; }
.page-h1 { font-size:20px; font-weight:700; }
.page-sub { font-size:13px; color:var(--slate); margin-top:2px; }

/* ── BUTTONS ── */
.btn-primary { display:inline-flex; align-items:center; gap:8px; background:var(--blue); color:#fff; border:none; border-radius:8px; padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s; }
.btn-primary:hover { background:#1D4ED8; }
.btn-primary:disabled { background:#CBD5E1; cursor:not-allowed; }
.btn-sec { background:#fff; color:var(--navy); border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:13px; font-weight:500; cursor:pointer; font-family:inherit; transition:all .15s; display:inline-flex; align-items:center; gap:7px; }
.btn-sec:hover { border-color:var(--blue); color:var(--blue); }
.btn-link { background:none; border:none; color:var(--blue); font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:4px; padding:5px 8px; border-radius:6px; transition:background .15s; }
.btn-link:hover { background:var(--blue-light); }
.btn-amber { background:none; border:1px solid var(--amber); color:var(--amber); border-radius:6px; padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
.btn-dismiss { background:none; border:none; color:var(--slate); font-size:12px; cursor:pointer; font-family:inherit; }
.btn-xs { font-size:11px; font-weight:600; padding:5px 10px; border-radius:6px; cursor:pointer; font-family:inherit; border:1px solid var(--border); background:#fff; }
.btn-xs.blue { background:var(--blue); color:#fff; border-color:var(--blue); }
.btn-xs.blue:hover { background:#1D4ED8; }
.btn-xs.ghost:hover { border-color:var(--blue); color:var(--blue); }

/* ── CARD SHELL ── */
.card { background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden; }
.card-hd { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); }
.card-hd-l { display:flex; align-items:center; gap:10px; }
.card-title { font-size:14px; font-weight:600; }
.card-bd { padding:18px; }

/* ── BADGES ── */
.badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; }
.badge-amber{background:var(--amber-bg);color:var(--amber);} .badge-green{background:var(--green-bg);color:var(--green);} .badge-blue{background:var(--blue-light);color:var(--blue);} .badge-red{background:var(--red-bg);color:var(--red);} .badge-grey{background:#F1F5F9;color:var(--slate);} .badge-violet{background:#F5F3FF;color:var(--violet);}
.acc-badge { font-size:11px; font-weight:600; background:var(--blue-light); color:var(--blue); padding:2px 8px; border-radius:99px; }
.sev { font-size:10px; font-weight:700; padding:3px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:.03em; }
.sev-critical{background:var(--red-bg);color:var(--red);} .sev-high{background:#FFEDD5;color:var(--orange);} .sev-medium{background:var(--amber-bg);color:var(--amber);} .sev-low{background:#F1F5F9;color:var(--slate);}
.cond-pill { font-size:11px; font-weight:500; background:#FEF9EE; color:#B45309; border:1px solid #FDE68A; padding:3px 10px; border-radius:99px; }

/* ── KPI CARDS (clickable analytics style) ── */
.kpi-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
.kpi-grid.g5 { grid-template-columns:repeat(5,1fr); }
.ana-stat-card { background:#fff; border:1px solid var(--border); border-radius:10px; padding:16px; cursor:pointer; transition:all .2s; position:relative; }
.ana-stat-card:hover { border-color:var(--blue); box-shadow:var(--shadow-md); transform:translateY(-1px); }
.ana-stat-card.active-card { border-color:var(--blue); box-shadow:0 0 0 2px var(--blue-light); }
.ana-stat-card.flagged { border-left:3px solid var(--amber); }
.card-click-hint { position:absolute; top:10px; right:12px; font-size:10px; color:var(--slate-light); font-weight:500; }
.a-lbl { font-size:11px; color:var(--slate); text-transform:uppercase; letter-spacing:.06em; font-weight:600; margin-bottom:8px; }
.a-val { font-size:26px; font-weight:700; line-height:1; margin-bottom:6px; }
.a-val .unit { font-size:13px; color:var(--slate); font-weight:400; }
.a-sub { font-size:12px; color:var(--slate); }
.trend { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; margin-top:8px; }
.trend-good{background:var(--green-bg);color:var(--green);} .trend-bad{background:var(--red-bg);color:var(--red);} .trend-flat{background:#F1F5F9;color:var(--slate);}
.split-bar { height:8px; border-radius:99px; background:#F1F5F9; overflow:hidden; display:flex; margin-top:10px; }
.split-bar .seg-org { background:var(--blue); } .split-bar .seg-paid { background:var(--violet); }
.split-legend { display:flex; gap:14px; margin-top:8px; font-size:11px; color:var(--slate); }
.dot { width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:5px; vertical-align:middle; }

/* ── BANNERS ── */
.brief-banner { background:linear-gradient(90deg,#1E293B,#334155); color:#fff; border-radius:12px; padding:18px 22px; margin-bottom:18px; display:flex; align-items:center; gap:18px; box-shadow:var(--shadow-md); }
.brief-ico { width:44px; height:44px; border-radius:10px; background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.brief-txt { flex:1; }
.brief-hd { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#93C5FD; font-weight:600; margin-bottom:4px; }
.brief-msg { font-size:16px; font-weight:600; line-height:1.4; }
.brief-msg .hl { color:#FCA5A5; }
.brief-stat { text-align:center; padding:0 14px; border-left:1px solid rgba(255,255,255,.15); }
.brief-stat .n { font-size:24px; font-weight:700; }
.brief-stat .l { font-size:11px; color:#CBD5E1; }
.fatigue-banner { background:#FFFBEB; border:1px solid #FDE68A; border-left:4px solid var(--amber); border-radius:10px; padding:12px 16px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; }
.fatigue-txt { font-size:12px; color:#92400E; line-height:1.5; }
.insight-banner { background:var(--blue-light); border:1px solid var(--blue-mid); border-left:4px solid var(--blue); border-radius:10px; padding:12px 16px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; }
.insight-txt { font-size:12px; color:#1E40AF; line-height:1.5; }

/* ── ALERT LIST (ranked) ── */
.alert-row { display:flex; align-items:center; gap:14px; padding:13px 16px; border:1px solid var(--border); border-radius:10px; background:#fff; transition:box-shadow .15s,border-color .15s; margin-bottom:8px; }
.alert-row:hover { box-shadow:var(--shadow-md); border-color:var(--blue-mid); }
.alert-rank { width:26px; height:26px; border-radius:7px; background:var(--bg); color:var(--slate); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.alert-main { flex:1; min-width:0; }
.alert-name { font-size:13px; font-weight:600; }
.alert-meta-line { font-size:12px; color:var(--slate); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.alert-meta-line .mv { color:var(--navy); font-weight:600; }
.alert-loss { text-align:right; flex-shrink:0; }
.alert-loss .n { font-size:16px; font-weight:700; color:var(--red); }
.alert-loss .l { font-size:10px; color:var(--slate-light); text-transform:uppercase; letter-spacing:.05em; }
.alert-actions { display:flex; gap:6px; flex-shrink:0; }
.chip-plat { font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px; background:#F1F5F9; color:var(--slate); }

/* drill breadcrumb */
.drill-crumbs { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--slate); margin-bottom:12px; flex-wrap:wrap; }
.drill-crumbs .cr { padding:3px 9px; border-radius:6px; background:#fff; border:1px solid var(--border); cursor:pointer; }
.drill-crumbs .cr.active { background:var(--blue); color:#fff; border-color:var(--blue); }
.drill-crumbs .sep { color:var(--slate-light); }

/* ── DATA TABLE ── */
.tbl-wrap { overflow-x:auto; }
.data-tbl { width:100%; border-collapse:collapse; }
.data-tbl th { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--slate); font-weight:600; background:var(--bg); padding:10px 14px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
.data-tbl td { padding:11px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
.data-tbl tr:last-child td { border-bottom:none; }
.data-tbl tr.tbl-row { cursor:pointer; transition:background .1s; }
.data-tbl tr.tbl-row:hover { background:var(--bg); }
.data-tbl tr.tbl-row.selected { background:#EFF6FF; }
.res-bar { height:6px; background:var(--border); border-radius:99px; overflow:hidden; min-width:64px; display:inline-block; width:80px; vertical-align:middle; }
.res-fill { height:100%; border-radius:99px; display:block; }

/* ── HEAD OF ECOM: GAUGE ── */
.health-wrap { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
.gauge-box { text-align:center; }
.gauge-val { font-size:30px; font-weight:700; margin-top:-14px; }
.gauge-tag { font-size:12px; font-weight:600; margin-top:2px; }
.health-drivers { flex:1; min-width:240px; }
.driver-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.driver-lbl { font-size:12px; width:130px; color:var(--navy); font-weight:500; }
.driver-track { flex:1; height:8px; background:#F1F5F9; border-radius:99px; overflow:hidden; }
.driver-fill { height:100%; border-radius:99px; }
.driver-pct { font-size:12px; font-weight:700; width:38px; text-align:right; font-family:'DM Mono',monospace; }

/* exception grid */
.exc-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.exc-cell { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px; }
.exc-n { font-size:24px; font-weight:700; }
.exc-l { font-size:12px; color:var(--slate); margin-top:2px; }

/* ── SLA compliance rows ── */
.sla-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.sla-lbl { width:150px; font-size:12px; font-weight:500; }
.sla-track { flex:1; height:10px; background:#F1F5F9; border-radius:99px; overflow:hidden; }
.sla-fill { height:100%; border-radius:99px; }
.sla-pct { width:44px; text-align:right; font-size:12px; font-weight:700; font-family:'DM Mono',monospace; }

/* ── ALERT BUILDER WIZARD ── */
.wiz-steps { display:flex; align-items:center; margin-bottom:22px; }
.wiz-step { display:flex; align-items:center; gap:10px; flex:1; }
.wiz-step:last-child { flex:0; }
.wiz-num { width:30px; height:30px; border-radius:50%; background:#fff; border:2px solid var(--border); color:var(--slate-light); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; transition:all .2s; }
.wiz-step.active .wiz-num { border-color:var(--blue); background:var(--blue); color:#fff; }
.wiz-step.done .wiz-num { border-color:var(--green); background:var(--green); color:#fff; }
.wiz-step-lbl { font-size:12px; font-weight:600; color:var(--slate-light); white-space:nowrap; }
.wiz-step.active .wiz-step-lbl { color:var(--blue); }
.wiz-step.done .wiz-step-lbl { color:var(--navy); }
.wiz-line { flex:1; height:2px; background:var(--border); margin:0 10px; }
.wiz-step.done .wiz-line { background:var(--green); }
.wiz-pane { display:none; }
.wiz-pane.active { display:block; animation:fade .2s ease; }
@keyframes fade { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.wiz-q { font-size:15px; font-weight:600; margin-bottom:4px; }
.wiz-hint { font-size:12px; color:var(--slate); margin-bottom:16px; }
.entity-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
.entity-card { border:1.5px solid var(--border); border-radius:10px; padding:16px 12px; text-align:center; cursor:pointer; transition:all .15s; }
.entity-card:hover { border-color:var(--blue-mid); }
.entity-card.sel { border-color:var(--blue); background:var(--blue-light); }
.entity-card .ec-ico { width:36px; height:36px; border-radius:9px; background:#F1F5F9; color:var(--slate); display:flex; align-items:center; justify-content:center; margin:0 auto 8px; }
.entity-card.sel .ec-ico { background:var(--blue); color:#fff; }
.entity-card .ec-name { font-size:13px; font-weight:600; }
.entity-card .ec-sub { font-size:11px; color:var(--slate); margin-top:2px; }
.scope-block { margin-bottom:18px; }
.scope-lbl { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--slate); margin-bottom:8px; }
.ms-chips { display:flex; flex-wrap:wrap; gap:8px; }
.ms-chip { font-size:12px; font-weight:500; padding:6px 12px; border-radius:99px; border:1.5px solid var(--border); background:#fff; cursor:pointer; transition:all .12s; user-select:none; }
.ms-chip:hover { border-color:var(--blue-mid); }
.ms-chip.sel { background:var(--blue); color:#fff; border-color:var(--blue); }
.wiz-select, .wiz-input { font-family:inherit; font-size:13px; padding:8px 12px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--navy); outline:none; }
.wiz-select:focus, .wiz-input:focus { border-color:var(--blue); }
/* condition builder */
.cond-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.cond-logic { width:64px; }
.cond-metric { flex:1; min-width:160px; }
.cond-op { width:150px; }
.cond-value { width:120px; }
.cond-rm { width:32px; height:32px; border-radius:7px; border:1px solid var(--border); background:#fff; color:var(--slate); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.cond-rm:hover { border-color:var(--red); color:var(--red); }
.logic-tag { width:64px; text-align:center; font-size:11px; font-weight:700; color:var(--slate); }
.thresh-opt { display:flex; align-items:flex-start; gap:12px; padding:14px; border:1.5px solid var(--border); border-radius:10px; margin-bottom:10px; cursor:pointer; }
.thresh-opt.sel { border-color:var(--blue); background:var(--blue-light); }
.thresh-radio { width:18px; height:18px; border-radius:50%; border:2px solid var(--slate-light); flex-shrink:0; margin-top:2px; position:relative; }
.thresh-opt.sel .thresh-radio { border-color:var(--blue); }
.thresh-opt.sel .thresh-radio::after { content:''; position:absolute; width:8px; height:8px; border-radius:50%; background:var(--blue); top:3px; left:3px; }
.thresh-txt .tt-t { font-size:13px; font-weight:600; }
.thresh-txt .tt-s { font-size:12px; color:var(--slate); margin-top:2px; }
.notif-opt { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; margin-bottom:10px; }
.check-sw { width:20px; height:20px; border-radius:6px; border:2px solid var(--slate-light); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; }
.check-sw.on { background:var(--blue); border-color:var(--blue); }
.summary-card { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:16px; }
.summary-row { display:flex; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
.summary-row:last-child { border-bottom:none; }
.summary-k { width:150px; color:var(--slate); font-weight:500; flex-shrink:0; }
.summary-v { font-weight:600; flex:1; }
.wiz-footer { display:flex; align-items:center; justify-content:space-between; margin-top:20px; padding-top:18px; border-top:1px solid var(--border); }
.success-box { text-align:center; padding:40px 20px; }
.success-ico { width:64px; height:64px; border-radius:50%; background:var(--green-bg); color:var(--green); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }

/* ── TASKS ── */
.task-filters { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.task-filters select { font-family:inherit; font-size:12px; padding:7px 12px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--navy); outline:none; cursor:pointer; }
.sla-count { font-size:11px; font-weight:700; font-family:'DM Mono',monospace; padding:3px 9px; border-radius:6px; white-space:nowrap; }
.sla-ok{background:var(--green-bg);color:var(--green);} .sla-near{background:var(--amber-bg);color:var(--amber);} .sla-over{background:var(--red-bg);color:var(--red);} .sla-done{background:#F1F5F9;color:var(--slate);}
.st-pill { font-size:10px; font-weight:700; padding:3px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
.st-new{background:var(--blue-light);color:var(--blue);} .st-ack{background:#F5F3FF;color:var(--violet);} .st-prog{background:var(--amber-bg);color:var(--amber);} .st-done{background:var(--green-bg);color:var(--green);} .st-closed{background:#F1F5F9;color:var(--slate);}
.flag-ico { font-size:12px; }
/* task detail */
.detail-panel { margin-top:16px; background:#fff; border:1.5px solid var(--blue); border-radius:12px; overflow:hidden; animation:slideDown .25s ease; }
@keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
.dp-header { background:var(--blue-light); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; }
.dp-title { font-size:14px; font-weight:600; color:var(--blue); }
.dp-body { display:grid; grid-template-columns:1fr 1fr; }
.dp-col { padding:18px 20px; }
.dp-col:first-child { border-right:1px solid var(--border); }
.dp-col-lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--slate); margin-bottom:14px; }
/* timeline */
.timeline { position:relative; padding-left:6px; }
.tl-item { display:flex; gap:12px; padding-bottom:16px; position:relative; }
.tl-item:last-child { padding-bottom:0; }
.tl-item::before { content:''; position:absolute; left:7px; top:18px; bottom:0; width:2px; background:var(--border); }
.tl-item:last-child::before { display:none; }
.tl-dot { width:16px; height:16px; border-radius:50%; border:2px solid var(--border); background:#fff; flex-shrink:0; margin-top:1px; z-index:1; }
.tl-item.done .tl-dot { background:var(--green); border-color:var(--green); }
.tl-item.done::before { background:var(--green); }
.tl-item.current .tl-dot { background:var(--blue); border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-light); }
.tl-txt .tl-stage { font-size:13px; font-weight:600; }
.tl-txt .tl-time { font-size:11px; color:var(--slate); font-family:'DM Mono',monospace; }
.tl-txt .tl-note { font-size:11px; color:var(--slate); margin-top:2px; }
/* action log */
.log-item { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.log-ico { width:26px; height:26px; border-radius:7px; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--slate); }
.log-body { flex:1; }
.log-act { font-size:12px; font-weight:600; }
.log-meta { font-size:11px; color:var(--slate); }
.log-add { display:flex; gap:8px; margin-top:12px; }
.log-add select, .log-add input { font-family:inherit; font-size:12px; padding:7px 10px; border:1px solid var(--border); border-radius:7px; outline:none; }
.log-add input { flex:1; }
.sla-strip { display:flex; align-items:center; gap:12px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
.sla-strip.warn { background:#FFFBEB; border-color:#FDE68A; }
.sla-strip.esc { background:var(--red-bg); border-color:#FCA5A5; }

/* ── PLACEHOLDER (available persona) ── */
.avail-box { padding:60px 24px; text-align:center; max-width:620px; margin:20px auto; background:#fff; border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); }
.avail-ico { width:72px; height:72px; border-radius:18px; background:var(--indigo-bg); color:var(--indigo); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
.avail-title { font-size:20px; font-weight:700; margin-bottom:6px; }
.avail-sub { font-size:13px; color:var(--slate); margin-bottom:20px; }
.avail-kpis { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:22px; }
.avail-kpi { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 16px; font-size:12px; font-weight:600; color:var(--slate); }

/* ── ANALYTICS (heatmap + cohort reuse) ── */
.hm-days-hdr { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:4px; }
.hm-dh { font-size:10px; color:var(--slate-light); text-align:center; font-weight:500; }
.hm-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; max-width:360px; }
.hm-cell { aspect-ratio:1; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:9px; cursor:pointer; transition:transform .1s; border:1px solid transparent; }
.hm-cell:not(.hm-empty):hover { transform:scale(1.3); z-index:10; }
.hm-cell.hm-empty { background:transparent; cursor:default; }
.hm-cell.hm-none { background:#F8FAFC; border-color:var(--border); color:var(--slate-light); }
.hm-cell.hm-l1 { background:#DBEAFE; color:#1E40AF; }
.hm-cell.hm-l2 { background:#93C5FD; color:#1E3A8A; }
.hm-cell.hm-l3 { background:#3B82F6; color:#fff; }
.hm-cell.hm-l4 { background:#1D4ED8; color:#fff; }
.hm-legend { display:flex; align-items:center; gap:6px; margin-top:12px; }
.hm-leg-cell { width:16px; height:16px; border-radius:3px; }
.hm-leg-label { font-size:11px; color:var(--slate); }
.cohort-row { display:flex; gap:6px; flex-wrap:wrap; }
.cohort-cell { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:11px; text-align:center; min-width:80px; }
.cohort-cell.cohort-done { border-color:var(--green); background:var(--green-bg); }
.cohort-cell.cohort-ongoing { border-color:var(--amber); background:var(--amber-bg); }
.cohort-day { font-weight:700; color:var(--navy); font-size:13px; }
.cohort-remain { color:var(--slate); font-size:10px; margin-top:2px; }

/* ── CHART ── */
.chart-wrap { position:relative; height:200px; }
.chart-wrap.sm { height:150px; }

/* ── TOOLTIP ── */
.tooltip { position:fixed; background:var(--navy); color:#fff; padding:8px 12px; border-radius:8px; font-size:12px; pointer-events:none; z-index:999; display:none; box-shadow:0 4px 16px rgba(0,0,0,.2); max-width:220px; }

/* ── TOAST ── */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--navy); color:#fff; padding:12px 20px; border-radius:10px; font-size:13px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:500; opacity:0; pointer-events:none; transition:all .25s; display:flex; align-items:center; gap:10px; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#CBD5E1; border-radius:99px; }

/* ── TEST PANEL ── */
.test-panel { position:fixed; bottom:16px; right:16px; z-index:300; }
.test-toggle { background:var(--navy); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; box-shadow:0 4px 12px rgba(0,0,0,.3); }
.test-drawer { display:none; position:absolute; bottom:48px; right:0; width:390px; background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,.15); max-height:74vh; overflow-y:auto; }
.test-drawer.open { display:block; }
.test-header { padding:12px 16px; border-bottom:1px solid var(--border); font-size:13px; font-weight:700; color:var(--navy); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:#fff; z-index:2; }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function trendClass(tc){ return tc==='good'?'trend-good':tc==='bad'?'trend-bad':'trend-flat'; }
function sevPill(sev){ return '<span class="sev sev-'+sev+'">'+sev+'</span>'; }
function toast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = '<svg width="16" height="16" fill="none" stroke="#4ADE80" stroke-width="2" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>'+esc(msg);
  t.classList.add('show');
  clearTimeout(window._tt); window._tt = setTimeout(()=>t.classList.remove('show'), 2600);
}

function render(){
  destroyCharts();
  const main = document.getElementById('main');
  if(state.view==='dashboard') main.innerHTML = renderDashboard();
  else if(state.view==='alerts') main.innerHTML = renderBuilder();
  else if(state.view==='tasks') main.innerHTML = renderTasks();
  else if(state.view==='analytics') main.innerHTML = renderAnalytics();
  else if(state.view==='supply') main.innerHTML = renderSupply();
  document.querySelectorAll('.si').forEach(si=>si.classList.toggle('active', si.dataset.view===state.view));
  postRender();
}
function postRender(){
  if(state.view==='dashboard'){
    if(state.persona==='kam_qcomm') buildQCCharts();
    else if(state.persona==='perf_mktg') buildPMCharts();
    else if(state.persona==='head_ecom') buildHECharts();
  }
  if(state.view==='alerts') initBuilder();
  if(state.view==='tasks') filterTasks();
  if(state.view==='analytics') initAnalyticsHeatmap();
  if(state.view==='supply') initSupply();
}

function condRowHTML(id, logic, showLogic){

    ? '<select class="wiz-select cond-logic" data-role="logic"><option>AND</option><option>OR</option></select>'
    : '<div class="logic-tag">WHERE</div>';
  return '<div class="cond-row" data-cid="'+id+'">'+logicSel
    +'<select class="wiz-select cond-metric" data-role="metric">'+metrics+'</select>'
    +'<select class="wiz-select cond-op" data-role="op">'+ops+'</select>'

    +'<div class="ms-chip sel" onclick="toggleChip(this)">KAM Q-Commerce</div>'

function pane6(){

function initBuilder(){
  wizStep = 1;
  document.getElementById('cond-rows').innerHTML = condRowHTML(1,'',false)+condRowHTML(2,'AND',true);
  // preset default values
  const rows = document.querySelectorAll('#cond-rows .cond-row');
  if(rows[0]){ rows[0].querySelector('[data-role="metric"]').value='On-Shelf Availability (OSA %)'; rows[0].querySelector('[data-role="op"]').value='is below (<)'; rows[0].querySelector('[data-role="val"]').value='70'; }
  if(rows[1]){ rows[1].querySelector('[data-role="metric"]').value='Days of Cover'; rows[1].querySelector('[data-role="op"]').value='is below (<)'; rows[1].querySelector('[data-role="val"]').value='7'; }
  condCounter = 2;
  updateWizUI();
}
let condCounter = 2;
function selectEntity(id){ document.querySelectorAll('#wiz-body .entity-card').forEach(c=>c.classList.toggle('sel', c.dataset.entity===id)); }
function toggleChip(el){ el.classList.toggle('sel'); }
function selectThresh(id){ document.querySelectorAll('#wiz-body .thresh-opt').forEach(o=>o.classList.toggle('sel', o.dataset.thresh===id)); }
function toggleCheck(el){ el.classList.toggle('on'); }
function addCondRow(logic){
  condCounter++;
  const wrap = document.getElementById('cond-rows');
  wrap.insertAdjacentHTML('beforeend', condRowHTML(condCounter, logic, true));
}
function removeCondRow(id){
  const rows = document.querySelectorAll('#cond-rows .cond-row');
  if(rows.length<=1){ toast('At least one condition is required'); return; }
  const row = document.querySelector('#cond-rows .cond-row[data-cid="'+id+'"]');
  if(row) row.remove();
  // ensure first row shows WHERE not a logic dropdown
  const first = document.querySelector('#cond-rows .cond-row');
  if(first && first.querySelector('[data-role="logic"]')){
    const sel = first.querySelector('[data-role="logic"]');
    const div = document.createElement('div'); div.className='logic-tag'; div.textContent='WHERE';
    sel.replaceWith(div);
  }
}
function wizNext(){
  if(wizStep<6){ wizStep++; updateWizUI(); if(wizStep===6) buildSummary(); }
  else activateAlert();
}
function wizBack(){ if(wizStep>1){ wizStep--; updateWizUI(); } }
function updateWizUI(){
  document.querySelectorAll('#wiz-body .wiz-pane').forEach(p=>p.classList.toggle('active', +p.dataset.pane===wizStep));
  document.querySelectorAll('#wiz-steps .wiz-step').forEach(s=>{
    const n=+s.dataset.step; s.classList.toggle('active', n===wizStep); s.classList.toggle('done', n<wizStep);
  });
  document.getElementById('wiz-cur').textContent = wizStep;
  document.getElementById('wiz-back').style.visibility = wizStep===1?'hidden':'visible';
  const next = document.getElementById('wiz-next');
  next.innerHTML = wizStep===6
    ? '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>Activate alert'
    : 'Next';
}
function gatherConfig(){
  const entity = (document.querySelector('#wiz-body .entity-card.sel')||{}).dataset ? document.querySelector('#wiz-body .entity-card.sel').querySelector('.ec-name').textContent : 'Products';
  const plats = Array.from(document.querySelectorAll('#scope-plats .ms-chip.sel')).map(c=>c.textContent);
  const cats = Array.from(document.querySelectorAll('#scope-cats .ms-chip.sel')).map(c=>c.textContent);
  const conds = Array.from(document.querySelectorAll('#cond-rows .cond-row')).map((r,i)=>{
    const logic = r.querySelector('[data-role="logic"]') ? r.querySelector('[data-role="logic"]').value+' ' : '';
    const m = r.querySelector('[data-role="metric"]').value;
    const op = r.querySelector('[data-role="op"]').value.replace(/\s*\(.*\)/,'');
    const v = r.querySelector('[data-role="val"]').value||'—';
    return (i>0?logic:'')+m+' '+op+' '+v;
  });
  const thresh = (document.querySelector('#wiz-body .thresh-opt.sel')||{}).querySelector ? document.querySelector('#wiz-body .thresh-opt.sel').querySelector('.tt-t').textContent : 'First breach';
  const notifs = Array.from(document.querySelectorAll('#wiz-body .check-sw.on')).map(c=>({inapp:'In-app',daily:'Daily digest',weekly:'Weekly digest'})[c.dataset.notif]).filter(Boolean);
  return { entity, plats, cats, conds, thresh, notifs };
}
function buildSummary(){
  const c = gatherConfig();
  const row = (k,v)=>'<div class="summary-row"><div class="summary-k">'+k+'</div><div class="summary-v">'+v+'</div></div>';
  document.getElementById('wiz-summary').innerHTML =
    row('Entity', c.entity)
    +row('Platforms', c.plats.join(', ')||'—')
    +row('Category', c.cats.join(', ')||'—')
    +row('Conditions', c.conds.map(x=>'<span class="cond-pill" style="margin:2px 2px 2px 0;display:inline-block;">'+esc(x)+'</span>').join(' '))
    +row('Threshold', c.thresh)
    +row('Notify', c.notifs.join(' · ')||'In-app');
}
function activateAlert(){
  const name = (document.getElementById('wiz-name')||{}).value || 'New Alert';
  const c = gatherConfig();
  alertCountAdded++;
  document.getElementById('wiz-body').innerHTML =
    '<div class="success-box"><div class="success-ico"><svg width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>'

function taskRowHTML(t){

function filterTasks(){
  const s = (document.getElementById('f-status')||{}).value || 'All statuses';

  const list = TASKS.filter(t=>
    (s==='All statuses'||t.status===s) &&

    (p==='All platforms'||t.platform===p));
  document.getElementById('task-tbody').innerHTML = list.map(taskRowHTML).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--slate);padding:30px;">No tasks match these filters.</td></tr>';

const STAGES = ['Alert Fired','Auto-Created','Assigned','Acknowledged','In Progress','Done','Auto-verified','Closed'];
function openTask(id){
  selectedTask = id;

  const t = TASKS.find(x=>x.id===id);
  const stageHTML = STAGES.map((s,i)=>{
    const n=i+1; const cls = n<t.stage?'done':(n===t.stage?'current':'');

    return '<div class="tl-item '+cls+'"><div class="tl-dot"></div><div class="tl-txt"><div class="tl-stage">'+s+'</div>'
      +(n<=t.stage?'<div class="tl-time">'+stageTime(t,n)+'</div>':'')

  document.getElementById('task-detail').innerHTML =
    '<div class="detail-panel" id="detail-panel"><div class="dp-header"><div class="dp-title">'+t.title+' · '+t.id+'</div>'
    +'<button class="btn-link" onclick="closeTask()">Close ✕</button></div>'
    +'<div style="padding:14px 20px 0;">'+slaStrip+'</div>'
    +'<div class="dp-body"><div class="dp-col"><div class="dp-col-lbl">Lifecycle timeline</div><div class="timeline">'+stageHTML+'</div></div>'
    +'<div class="dp-col"><div class="dp-col-lbl">Action log</div><div id="log-list">'+logHTML+'</div>'
    +(t.status==='Closed'?'':'<div class="log-add"><select id="log-type">'+ACTION_TYPES.map(a=>'<option>'+a+'</option>').join('')+'</select>'
    +'<input id="log-text" placeholder="Add a note…"><button class="btn-xs blue" onclick="addLog(\''+t.id+'\')">Log</button></div>')
    +'</div></div></div>';
  document.getElementById('detail-panel').scrollIntoView({behavior:'smooth', block:'nearest'});
}
function stageTime(t,n){
  const map = { 1:'06:00', 2:'06:00', 3:'06:01', 4:'09:12', 5:'10:40', 6:'—', 7:'—', 8:'Yst 06:00' };
  return n<=3 ? 'Today '+map[n] : (n<=t.stage ? (t.log[Math.min(n-4,t.log.length-1)]?t.log[Math.min(n-4,t.log.length-1)].t:'—') : '—');
}
function logIcon(ic){
  const m = {
    eye:'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>',
    doc:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/>',
    up:'<path d="M12 19V5m-7 7l7-7 7 7"/>',
    img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
    check:'<path d="M20 6L9 17l-5-5"/>',
  };
  return '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">'+(m[ic]||m.doc)+'</svg>';
}
function addLog(id){
  const t = TASKS.find(x=>x.id===id);
  const type = document.getElementById('log-type').value;
  const txt = document.getElementById('log-text').value.trim();
  t.log.push({ a: type==='Free-text note'? (txt||'Note added') : type+(txt?' — '+txt:''), by:t.assignee, t:'Just now', ic:'doc' });
  if(t.status==='New'){ t.status='Acknowledged'; t.stage=Math.max(t.stage,4); }
  else if(t.status==='Acknowledged'){ t.status='In Progress'; t.stage=Math.max(t.stage,5); }

  toast('Action logged');
}

function openSupplyDrill(bk,idx){
  const map={b1:BUCKET1,b2:BUCKET2,b3:BUCKET3}; const r=map[bk][idx];
  const onHand=r.onHand||0, daily=r.daily||25;
  const bucketName={b1:'OOS · Supply not in',b2:'OOS · Supplied but off-shelf',b3:'In-stock · Reorder breach'}[bk];
  const proj = onHand>0 ? docProjectionSVG(onHand,daily) : null;
  const pipeline = bk==='b1' ? (r.openPO==='No open PO' ? '<span class="ev ev-bad">No open PO in pipeline</span>' : '<span class="ev ev-warn">'+r.openPO+'</span>'+(r.asn!=='—'?' <span class="ev ev-warn">'+r.asn+'</span>':''))
    : bk==='b2' ? '<span class="ev ev-ok">Last GRN '+r.lastGRN+' · '+r.inwarded+' units</span> <span class="ev ev-ok">OFR '+r.ofr+'%</span> <span class="ev ev-ok">on-hand '+r.onHand+'</span>'
    : '<span class="ev ev-bad">No open PO · reorder point '+r.reorder+'d</span> <span class="ev ev-ok">suggested '+r.suggested+' units</span>';
  const inwHist = bk==='b1' ? 'Last GRN <b>'+r.lastGRN+'</b>. No inwarding since — pipeline stalled.'
    : bk==='b2' ? 'Last GRN <b>'+r.lastGRN+'</b> · inwarded <b>'+r.inwarded+'</b> units · system on-hand <b>'+r.onHand+'</b>. Supply is present.'
    : 'On-hand <b>'+r.onHand+'</b> · depleting <b>'+daily+'</b>/day · DoC <b>'+r.doc+'d</b> vs lead time <b>'+r.lead+'d</b>.';
  const docLine = proj ? '<div class="spark-wrap">'+proj.svg+'<div><div style="font-size:18px;font-weight:700;">~'+proj.zero+'d</div><div style="font-size:11px;color:var(--slate);">projected to zero at current rate</div></div></div>'
    : '<div style="font-size:13px;font-weight:600;color:var(--red);">Already out of stock — 0 days cover</div>';
  document.getElementById('sku-drill').innerHTML =
    '<div class="sku-drill"><div class="dp-header"><div class="dp-title">'+r.sku+' · '+r.platform+' · '+r.city+'</div><button class="btn-link" onclick="document.getElementById(\'sku-drill\').innerHTML=\'\'">Close ✕</button></div>'
    +'<div class="dp-body"><div class="dp-col"><div class="dp-col-lbl">Supply evidence</div>'
    +'<div class="inw-hist" style="margin-bottom:12px;">'+inwHist+'</div>'
    +'<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);margin-bottom:6px;">PO pipeline</div><div class="br-ev">'+pipeline+'</div>'
    +'<div style="margin-top:12px;"><span class="badge badge-grey">Bucket: '+bucketName+'</span></div></div>'
    +'<div class="dp-col"><div class="dp-col-lbl">Days-of-cover projection</div>'+docLine
    +'<div style="margin-top:14px;font-size:11px;color:var(--slate);">Daily sales rate <b style="color:var(--navy)">'+daily+'</b> units/day'+(bk==='b3'?' · reorder before <b style="color:var(--navy)">'+r.raiseBy+'</b>':'')+'</div></div></div></div>';
  document.getElementById('sku-drill').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function docProjectionSVG(onHand,daily){
  const w=200,h=52,days=Math.max(2,Math.min(Math.ceil(onHand/daily),10));
  const pts=[]; for(let i=0;i<=days;i++) pts.push(Math.max(0,onHand-daily*i));
  const max=onHand||1;
  const coords=pts.map((p,i)=>[(i/days)*(w-8)+4,h-(p/max)*(h-12)-6]);
  const poly=coords.map(c=>c[0].toFixed(0)+','+c[1].toFixed(0)).join(' ');
  return { svg:'<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><line x1="4" y1="'+(h-6)+'" x2="'+(w-4)+'" y2="'+(h-6)+'" stroke="#E2E8F0" stroke-width="1"/><polyline points="'+poly+'" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>', zero:Math.ceil(onHand/daily) };
}

function openPO(id,noScroll){
  selectedPO=id;
  document.querySelectorAll('#po-tbody tr').forEach(tr=>tr.classList.toggle('selected', tr.id==='po-row-'+id));
  const po=POS.find(p=>p.id===id); if(!po) return;

    +'<div style="margin-top:8px;font-size:11px;color:var(--slate);">Drop-off Ordered → Inwarded: <strong style="color:var(--navy)">'+dropUnits+' units</strong>'+(po.ord>0?' ('+Math.round(dropUnits/po.ord*100)+'%)':'')+'.</div></div></div>';

    ['tc2','<strong>Switch to Head of Ecom</strong> renders the portfolio health gauge'],
    ['tc3','<strong>Switch to KAM Marketplace</strong> (unbuilt) shows the "dashboard available" state'],
  ]},
  { title:'Navigation', cases:[
    ['tc4','<strong>Sidebar → Alert Builder</strong> opens the 6-step wizard'],
    ['tc5','<strong>Sidebar → Tasks</strong> shows the task list'],
    ['tc6','<strong>Sidebar → Dashboard</strong> returns to the active persona'],
  ]},
  { title:'Dashboard KPIs', cases:[
    ['tc7','<strong>KAM Q-Comm briefing</strong> banner shows the 7-alerts / ₹2.1L message'],
    ['tc8','<strong>Today\'s Alerts</strong> are ranked by est. sales loss (highest first)'],
    ['tc9','<strong>Create Task</strong> from an alert adds a task and opens Tasks'],
    ['tc10','<strong>Perf keyword table</strong> renders 6 keywords with verdicts'],
    ['tc11','<strong>Head of Ecom SLA</strong> shows Content as the lowest (44%)'],
  ]},
  { title:'Alert Builder', cases:[
    ['tc12','<strong>Next</strong> advances the step indicator (1 → 2)'],
    ['tc13','<strong>Back</strong> returns to the previous step'],
    ['tc14','<strong>Entity select</strong> highlights the chosen entity card'],
    ['tc15','<strong>Activate</strong> shows success and increments active alert count'],
  ]},
  { title:'Condition Builder', cases:[
    ['tc16','<strong>Add condition</strong> appends a new AND/OR row'],
    ['tc17','<strong>Remove condition</strong> deletes a row (min 1 enforced)'],
    ['tc18','<strong>Metric dropdown</strong> includes OSA, Paid SOS, Buy Box &amp; more'],
  ]},
  { title:'Task Lifecycle', cases:[
    ['tc19','<strong>Task row click</strong> opens the detail panel with lifecycle timeline'],
    ['tc20','<strong>Action log</strong> add appends an entry &amp; advances status'],
    ['tc21','<strong>Auto-close example</strong> present ("condition resolved in data")'],
    ['tc22','<strong>Filter by status</strong> narrows the task rows'],
  ]},
  { title:'Replenishment &amp; Supply Chain', cases:[
    ['tc23','<strong>Three root-cause buckets</strong> render (supply-not-in / off-shelf / reorder)'],
    ['tc24','<strong>Create Task from a bucket</strong> spawns a supply task &amp; opens Tasks'],
    ['tc25','<strong>PO row click</strong> opens the stage timeline (Raised→GRN) + funnel'],
    ['tc26','<strong>Reorder table sort</strong> toggles the row order'],
    ['tc27','<strong>Lead-time analytics</strong> renders the PO→GRN headline + chart'],
    ['tc28','<strong>QC dashboard strip</strong> shows the 3 Supply Chain Action mini-cards'],
  ]},
];
function buildTestPanel(){
  document.getElementById('test-body').innerHTML = TEST_GROUPS.map(g=>
    '<div class="test-section"><div class="test-section-title">'+g.title+'</div>'
    +g.cases.map(c=>'<div class="test-case"><div class="test-id">'+c[0].toUpperCase().replace('TC','TC-')+'</div>'
      +'<div class="test-desc">'+c[1]+'<span class="test-result" id="res-'+c[0]+'"></span></div>'
      +'<button class="test-btn run" id="btn-'+c[0]+'" onclick="runTest(\''+c[0]+'\')">Run</button></div>').join('')
    +'</div>'
  ).join('');
}
function toggleTestPanel(){ document.getElementById('test-drawer').classList.toggle('open'); }
function runAllTests(){ TEST_GROUPS.forEach(g=>g.cases.forEach(c=>runTest(c[0]))); }

function runTest(id){
  const actions = {
    tc1: ()=>{ selectPersona('perf_mktg'); return document.body.innerHTML.includes('Media Efficiency') && !!document.getElementById('c-split') ? 'pass':'fail'; },
    tc2: ()=>{ selectPersona('head_ecom'); return document.querySelector('.gauge-val') && document.querySelector('.gauge-val').textContent.includes('74') ? 'pass':'fail'; },
    tc3: ()=>{ selectPersona('kam_mktplace'); const ok = !!document.querySelector('.avail-box'); selectPersona('kam_qcomm'); return ok?'pass':'fail'; },
    tc4: ()=>{ navTo('alerts'); return document.getElementById('wiz-steps')?'pass':'fail'; },
    tc5: ()=>{ navTo('tasks'); return document.getElementById('task-tbody')?'pass':'fail'; },
    tc6: ()=>{ navTo('dashboard'); return document.querySelector('.page-h1') && state.view==='dashboard' ?'pass':'fail'; },
    tc7: ()=>{ selectPersona('kam_qcomm'); return document.querySelector('.brief-msg') && document.querySelector('.brief-msg').textContent.includes('7 alerts') && document.querySelector('.brief-msg').textContent.includes('2.1L') ?'pass':'fail'; },
    tc8: ()=>{ selectPersona('kam_qcomm'); const losses = Array.from(document.querySelectorAll('.alert-loss .n')).map(n=>parseFloat(n.textContent.replace(/[₹L]/g,''))); let sorted=true; for(let i=1;i<losses.length;i++){ if(losses[i]>losses[i-1]){ sorted=false; break; } } return sorted?'pass':'fail'; },
    tc9: ()=>{ selectPersona('kam_qcomm'); const before=TASKS.length; document.querySelector('.alert-row .btn-xs.blue').click(); return TASKS.length===before+1 && state.view==='tasks' ?'pass':'fail'; },
    tc10: ()=>{ selectPersona('perf_mktg'); const rows=document.querySelectorAll('.data-tbl tbody tr'); return rows.length===6?'pass':'fail'; },
    tc11: ()=>{ selectPersona('head_ecom'); const txt=document.body.innerHTML; return txt.includes('44%') && txt.includes('Content')?'pass':'fail'; },
    tc12: ()=>{ navTo('alerts'); wizNext(); const ok = wizStep===2 && document.querySelector('.wiz-step[data-step="2"]').classList.contains('active'); return ok?'pass':'fail'; },
    tc13: ()=>{ navTo('alerts'); wizNext(); wizBack(); return wizStep===1?'pass':'fail'; },
    tc14: ()=>{ navTo('alerts'); selectEntity('keywords'); const ok=document.querySelector('.entity-card[data-entity="keywords"]').classList.contains('sel'); selectEntity('products'); return ok?'pass':'fail'; },
    tc15: ()=>{ navTo('alerts'); const before=alertCountAdded; wizStep=6; updateWizUI(); buildSummary(); activateAlert(); const ok=alertCountAdded===before+1 && document.querySelector('.success-box'); navTo('alerts'); return ok?'pass':'fail'; },
    tc16: ()=>{ navTo('alerts'); const before=document.querySelectorAll('#cond-rows .cond-row').length; addCondRow('AND'); const after=document.querySelectorAll('#cond-rows .cond-row').length; return after===before+1?'pass':'fail'; },
    tc17: ()=>{ navTo('alerts'); addCondRow('AND'); const before=document.querySelectorAll('#cond-rows .cond-row').length; const last=document.querySelectorAll('#cond-rows .cond-row')[before-1]; removeCondRow(+last.dataset.cid); const after=document.querySelectorAll('#cond-rows .cond-row').length; return after===before-1?'pass':'fail'; },
    tc18: ()=>{ navTo('alerts'); const opts=Array.from(document.querySelector('#cond-rows [data-role="metric"]').options).map(o=>o.value); return opts.some(o=>o.includes('OSA')) && opts.some(o=>o.includes('Paid SOS')) && opts.some(o=>o.includes('Buy Box'))?'pass':'fail'; },
    tc19: ()=>{ navTo('tasks'); openTask('T-2041'); return document.getElementById('detail-panel') && document.querySelector('.timeline')?'pass':'fail'; },
    tc20: ()=>{ navTo('tasks'); openTask('T-2043'); const inp=document.getElementById('log-text'); inp.value='test note'; addLog('T-2043'); const t=TASKS.find(x=>x.id==='T-2043'); const hasNote=document.getElementById('log-list').innerHTML.includes('test note'); return hasNote && t.status!=='New' ?'pass':'fail'; },
    tc21: ()=>{ navTo('tasks'); openTask('T-2038'); return document.body.innerHTML.includes('condition resolved in data')?'pass':'fail'; },
    tc22: ()=>{ navTo('tasks'); document.getElementById('f-status').value='Closed'; const list=filterTasks(); const ok=list.every(t=>t.status==='Closed') && list.length>0; document.getElementById('f-status').value='All statuses'; filterTasks(); return ok?'pass':'fail'; },
    tc23: ()=>{ navTo('supply'); const cards=document.querySelectorAll('#supply-view .bucket-card'); return cards.length===3 && document.body.innerHTML.includes('Supplied but off-shelf')?'pass':'fail'; },
    tc24: ()=>{ navTo('supply'); const before=TASKS.length; createBucketTask('b1',0); const t=TASKS[0]; return TASKS.length===before+1 && /Supply|Reorder/.test(t.type) && state.view==='tasks' ?'pass':'fail'; },
    tc25: ()=>{ navTo('supply'); switchSupplyTab('tracker'); openPO('BLK-88231'); const h=document.getElementById('po-detail').innerHTML; return h.includes('po-tl') && h.includes('ASN') && h.includes('funnel')?'pass':'fail'; },
    tc26: ()=>{ navTo('supply'); switchSupplyTab('analytics'); const first=()=>document.querySelector('#reorder-tbody tr td').textContent; const a=first(); sortReorder(); const b=first(); sortReorder(); return a!==b?'pass':'fail'; },
    tc27: ()=>{ navTo('supply'); switchSupplyTab('analytics'); return document.body.innerHTML.includes('PO raise to inwarding') && !!document.getElementById('sc-leadbar')?'pass':'fail'; },
    tc28: ()=>{ selectPersona('kam_qcomm'); const strip=document.querySelector('.sc-strip'); return strip && strip.querySelectorAll('.sc-mini').length===3?'pass':'fail'; },
  };
  try{
    const result = actions[id]();
    const btn = document.getElementById('btn-'+id);
    if(btn){ btn.className='test-btn '+result; btn.textContent = result==='pass'?'✓ Pass':'✗ Fail'; }
    const res = document.getElementById('res-'+id);
    if(res) res.textContent = result==='pass'?'✓ Verified':'✗ Check failed';
  }catch(e){
    const btn=document.getElementById('btn-'+id);
    if(btn){ btn.className='test-btn fail'; btn.textContent='✗ Error'; }
    console.error(id, e);
  }
}
